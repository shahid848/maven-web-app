```yaml id="n1y5qx"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-web-app-deployment
  labels:
    app: maven-web-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: maven-web-app

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: maven-web-app

    spec:
      containers:
      - name: maven-web-app-container
        image: shahid848/maven-web-app:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: maven-web-app-service

spec:
  type: LoadBalancer

  selector:
    app: maven-web-app

  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
```
